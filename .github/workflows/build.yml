name: Build and push Listening Brain worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -x
          IMG="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          mkdir -p build-logs
          echo "building $IMG:latest" | tee build-logs/build.log
          docker build \
            --progress=plain \
            --build-arg HF_TOKEN="$HF_TOKEN" \
            -t "$IMG:latest" . 2>&1 | tee -a build-logs/build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "docker build exit code: $BUILD_RC" | tee -a build-logs/build.log
          if [ $BUILD_RC -ne 0 ]; then
            tail -200 build-logs/build.log
            exit $BUILD_RC
          fi
          docker push "$IMG:latest" 2>&1 | tee -a build-logs/push.log

      - name: Upload build log (artifact, public)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: build-logs/
          retention-days: 7
